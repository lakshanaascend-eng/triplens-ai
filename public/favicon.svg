<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- Compass ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- North needle (white, points up) -->
  <polygon points="16,5 18,16 16,14 14,16" fill="white"/>
  <!-- South needle (semi-transparent, points down) -->
  <polygon points="16,27 18,16 16,18 14,16" fill="rgba(255,255,255,0.45)"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
</svg>